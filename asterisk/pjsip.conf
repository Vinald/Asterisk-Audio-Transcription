[global]
type=global
default_realm=asterisk
keep_alive_interval=90
max_initial_qualify_time=0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12
external_media_address=YOUR_SERVER_PUBLIC_IP
external_signaling_address=YOUR_SERVER_PUBLIC_IP
tos=af41
cos=4

[anonymous]
type=aor
max_contacts=0

[anonymous]
type=endpoint
context=rejected

[codec](!)
disallow=all
allow=ulaw
allow=alaw

[common](!)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
ice_support=no
media_encryption=no
dtmf_mode=rfc4733
asymmetric_rtp_codec=yes
fax_detect=no
send_rpid=yes
rpid_immediate=yes

; --- Extension 100 ---
[auth-100]
type=auth
auth_type=userpass
username=100
password=1234
realm=asterisk

[100]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

[100](codec,common)
type=endpoint
context=ivr
auth=auth-100
outbound_auth=auth-100
aors=100
timers_sess_expires=1800
timers_min_se=90

