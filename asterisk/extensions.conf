[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; ── Block unknown callers ──────────────────────────────────────────────
[rejected]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)

; ── Incoming DID routing ───────────────────────────────────────────────
[incoming]
exten => 8446,1,Goto(ivr,8446,1)

; ── Direct extensions ─────────────────────────────────────────────────
[ivr]
exten => 200,1,Dial(PJSIP/200,30,rT)
 same => n,Hangup()
exten => 300,1,Dial(PJSIP/300,30,rT)
 same => n,Hangup()

; ── HASH AI Voice Assistant — entry (dial 8446) ────────────────────────
;   Step 1: Answer
;   Step 2: Beep
;   Step 3: Greeting  — "Hello friend! Welcome to the HASH conversational agent"
;   Step 4: Language menu — "Press 1 for English, Press 2 for Luganda"
; ──────────────────────────────────────────────────────────────────────
exten => 8446,1,NoOp(HASH AI call from ${CALLERID(num)})
 same => n,Set(CALLID=${STRFTIME(${EPOCH},,HASH-%Y%m%d-%H%M%S)}-${CUT(UNIQUEID,.,2)})
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=900)
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Playback(hash-greeting)
 same => n,Wait(1)
 same => n,Background(hash-language-menu)
 same => n,WaitExten(5)

; ── Language 1 = English ──────────────────────────────────────────────
;   Step 5: Save language + play English welcome
;   Step 6: Go to English question prompt context
; ──────────────────────────────────────────────────────────────────────
exten => 1,1,NoOp(Language selected: English)
 same => n,Set(LANGUAGE=English)
 same => n,AGI(save_language.py,${CALLID},English)
 same => n,Playback(hash-welcome-english)
 same => n,Wait(1)
 same => n,Goto(ivr_en_question,s,1)

; ── Language 2 = Luganda ──────────────────────────────────────────────
;   Step 5: Save language + play Luganda welcome
;   Step 6: Go to Luganda question prompt context
; ──────────────────────────────────────────────────────────────────────
exten => 2,1,NoOp(Language selected: Luganda)
 same => n,Set(LANGUAGE=Luganda)
 same => n,AGI(save_language.py,${CALLID},Luganda)
 same => n,Playback(hash-welcome-luganda)
 same => n,Wait(1)
 same => n,Goto(ivr_lg_question,s,1)

; Invalid key during language selection → replay menu
exten => i,1,NoOp(Invalid language selection)
 same => n,Playback(hash-invalid-lang)
 same => n,Background(hash-language-menu)
 same => n,WaitExten(5)

; Timeout during language selection → log + goodbye
exten => t,1,NoOp(Timeout during language selection)
 same => n,AGI(log_no_question.py,${CALLID},,lang_timeout)
 same => n,Playback(hash-goodbye-english)
 same => n,Hangup()

; ── English: "Do you have a question?" prompt ─────────────────────────
;   Press 1 = Yes → record two questions
;   Press 2 = No  → goodbye
; ──────────────────────────────────────────────────────────────────────
[ivr_en_question]
exten => s,1,NoOp(English question prompt)
 same => n,Background(hash-question-prompt-english)
 same => n,WaitExten(10)

exten => 1,1,NoOp(English: caller has a question)
 same => n,Goto(ivr_en_questions,s,1)

exten => 2,1,NoOp(English: caller has no question)
 same => n,AGI(log_no_question.py,${CALLID},${LANGUAGE},no_question)
 same => n,Playback(hash-goodbye-english)
 same => n,Hangup()

exten => i,1,NoOp(Invalid choice — English question prompt)
 same => n,Playback(hash-invalid-choice-english)
 same => n,Background(hash-question-prompt-english)
 same => n,WaitExten(10)

exten => t,1,NoOp(Timeout — English question prompt)
 same => n,AGI(log_no_question.py,${CALLID},${LANGUAGE},timeout)
 same => n,Playback(hash-goodbye-english)
 same => n,Hangup()

; ── English: Q1 → AI response → Q2 → AI response → Goodbye ───────────
[ivr_en_questions]
exten => s,1,NoOp(English Q1 recording)
 same => n,Playback(hash-ask-q1-english)
 same => n,Playback(beep)
 same => n,Record(/tmp/input-${CALLID}-1.wav,3,10,k)
 same => n,Playback(beep)
 same => n,Playback(hash-processing-english)
 same => n,StartMusicOnHold(default)
 same => n,AGI(ai_assistant.py,/tmp/input-${CALLID}-1.wav,1,${LANGUAGE},${CALLID})
 same => n,StopMusicOnHold()
 same => n,Set(AI_RESPONSE_FILE_1=${AI_RESPONSE_FILE})
 same => n,GotoIf($["${AI_RESPONSE_FILE_1}" = ""]?ivr_en_questions,error,1)
 same => n,Playback(${AI_RESPONSE_FILE_1})
 same => n,Wait(1)
 same => n,NoOp(English Q2 recording)
 same => n,Playback(hash-ask-q2-english)
 same => n,Playback(beep)
 same => n,Record(/tmp/input-${CALLID}-2.wav,3,10,k)
 same => n,Playback(beep)
 same => n,Playback(hash-processing-english)
 same => n,StartMusicOnHold(default)
 same => n,AGI(ai_assistant.py,/tmp/input-${CALLID}-2.wav,2,${LANGUAGE},${CALLID})
 same => n,StopMusicOnHold()
 same => n,Set(AI_RESPONSE_FILE_2=${AI_RESPONSE_FILE})
 same => n,GotoIf($["${AI_RESPONSE_FILE_2}" = ""]?ivr_en_questions,error,1)
 same => n,Playback(${AI_RESPONSE_FILE_2})
 same => n,Wait(1)
 same => n,Playback(hash-goodbye-english)
 same => n,Wait(1)
 same => n,Hangup()

exten => error,1,NoOp(English AGI error)
 same => n,Playback(hash-error-english)
 same => n,Wait(1)
 same => n,Playback(hash-goodbye-english)
 same => n,Hangup()

; ── Luganda: "Do you have a question?" prompt ─────────────────────────
;   Nyiga 1 = Yee (Yes) → record two questions
;   Nyiga 2 = Nedda (No) → goodbye
; ──────────────────────────────────────────────────────────────────────
[ivr_lg_question]
exten => s,1,NoOp(Luganda question prompt)
 same => n,Background(hash-question-prompt-luganda)
 same => n,WaitExten(10)

exten => 1,1,NoOp(Luganda: caller has a question)
 same => n,Goto(ivr_lg_questions,s,1)

exten => 2,1,NoOp(Luganda: caller has no question)
 same => n,AGI(log_no_question.py,${CALLID},${LANGUAGE},no_question)
 same => n,Playback(hash-goodbye-luganda)
 same => n,Hangup()

exten => i,1,NoOp(Invalid choice — Luganda question prompt)
 same => n,Playback(hash-invalid-choice-luganda)
 same => n,Background(hash-question-prompt-luganda)
 same => n,WaitExten(10)

exten => t,1,NoOp(Timeout — Luganda question prompt)
 same => n,AGI(log_no_question.py,${CALLID},${LANGUAGE},timeout)
 same => n,Playback(hash-goodbye-luganda)
 same => n,Hangup()

; ── Luganda: Q1 → AI response → Q2 → AI response → Goodbye ───────────
[ivr_lg_questions]
exten => s,1,NoOp(Luganda Q1 recording)
 same => n,Playback(hash-ask-q1-luganda)
 same => n,Playback(beep)
 same => n,Record(/tmp/input-${CALLID}-1.wav,3,10,k)
 same => n,Playback(beep)
 same => n,Playback(hash-processing-luganda)
 same => n,StartMusicOnHold(default)
 same => n,AGI(ai_assistant.py,/tmp/input-${CALLID}-1.wav,1,${LANGUAGE},${CALLID})
 same => n,StopMusicOnHold()
 same => n,Set(AI_RESPONSE_FILE_1=${AI_RESPONSE_FILE})
 same => n,GotoIf($["${AI_RESPONSE_FILE_1}" = ""]?ivr_lg_questions,error,1)
 same => n,Playback(${AI_RESPONSE_FILE_1})
 same => n,Wait(1)
 same => n,NoOp(Luganda Q2 recording)
 same => n,Playback(hash-ask-q2-luganda)
 same => n,Playback(beep)
 same => n,Record(/tmp/input-${CALLID}-2.wav,3,10,k)
 same => n,Playback(beep)
 same => n,Playback(hash-processing-luganda)
 same => n,StartMusicOnHold(default)
 same => n,AGI(ai_assistant.py,/tmp/input-${CALLID}-2.wav,2,${LANGUAGE},${CALLID})
 same => n,StopMusicOnHold()
 same => n,Set(AI_RESPONSE_FILE_2=${AI_RESPONSE_FILE})
 same => n,GotoIf($["${AI_RESPONSE_FILE_2}" = ""]?ivr_lg_questions,error,1)
 same => n,Playback(${AI_RESPONSE_FILE_2})
 same => n,Wait(1)
 same => n,Playback(hash-goodbye-luganda)
 same => n,Wait(1)
 same => n,Hangup()

exten => error,1,NoOp(Luganda AGI error)
 same => n,Playback(hash-error-luganda)
 same => n,Wait(1)
 same => n,Playback(hash-goodbye-luganda)
 same => n,Hangup()

; ── Outgoing calls ────────────────────────────────────────────────────
[outgoing]
exten => _X.,1,Dial(PJSIP/${EXTEN}@300,30,rT)
 same => n,Hangup()
