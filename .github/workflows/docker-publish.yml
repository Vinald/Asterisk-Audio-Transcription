name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild and release, e.g. v1.0"
        required: true

env:
  IMAGE: ghcr.io/vinald/asterisk-audio-transcription

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build release notes from the annotated tag
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          # actions/checkout peels annotated tags to lightweight ones in its local
          # clone for tag-triggered workflows, so `git tag -l --format=...` reads
          # the commit message instead of the tag's own annotation. Read the real
          # tag object straight from the API instead.
          obj=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG")
          obj_type=$(echo "$obj" | jq -r '.object.type')
          obj_sha=$(echo "$obj" | jq -r '.object.sha')

          if [ "$obj_type" = "tag" ]; then
            msg=$(gh api "repos/${{ github.repository }}/git/tags/$obj_sha" --jq '.message')
          else
            msg=$(gh api "repos/${{ github.repository }}/git/commits/$obj_sha" --jq '.message')
          fi

          title=$(printf '%s\n' "$msg" | head -n1)
          echo "title=$title" >> "$GITHUB_OUTPUT"

          prev_tag=$(git tag --sort=-version:refname | grep -A1 -x "$TAG" | tail -n1)

          {
            printf '%s\n' "$msg" | tail -n +2 | sed '/./,$!d'
            if [ -n "$prev_tag" ] && [ "$prev_tag" != "$TAG" ]; then
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${TAG}"
            fi
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
