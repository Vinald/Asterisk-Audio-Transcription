<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Apply saved theme before paint to prevent flash -->
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
  <title>{% block title %}{% endblock %}{% if self.title() %} — {% endif %}HASH PBX Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; }
    .sidebar {
      width: 220px;
      min-height: 100vh;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }
    .sidebar .nav-link { color: rgba(255,255,255,.7); border-radius: 6px; }
    .sidebar .nav-link:hover { color: #fff !important; background: rgba(255,255,255,.1); }
    .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.18); }
    .sidebar .section-label { color: rgba(255,255,255,.35); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; padding: .5rem .75rem .25rem; }
    .main-content { flex: 1; min-width: 0; }
    .status-badge { font-size: .75rem; }
    .table thead tr { --bs-table-bg: var(--bs-tertiary-bg); }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--bs-secondary-color); padding-top: .75rem; padding-bottom: .75rem; }
    .table td { font-size: .875rem; vertical-align: middle; padding-top: .65rem; padding-bottom: .65rem; color: var(--bs-body-color); }
    .table tbody td a { color: var(--bs-body-color); }
    [data-bs-theme="dark"] .card { border: 1px solid rgba(255,255,255,.1) !important; }
.text-truncate-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-card .card-body { padding: 1.25rem 1.5rem; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .stat-card .stat-label { font-size: .8rem; color: var(--bs-secondary-color); margin-top: .25rem; }

    /* Caller row color coding — set Bootstrap's own table-bg variable so it
       applies through td/th cells (Bootstrap 5 paints cells, not the tr).
       Light mode uses low opacity; dark mode bumps it up for visibility. */
    tr.rc-0 { --bs-table-bg: rgba(13,110,253,.13); }
    tr.rc-1 { --bs-table-bg: rgba(25,135,84,.13); }
    tr.rc-2 { --bs-table-bg: rgba(220,53,69,.11); }
    tr.rc-3 { --bs-table-bg: rgba(255,193,7,.15); }
    tr.rc-4 { --bs-table-bg: rgba(13,202,240,.13); }
    tr.rc-5 { --bs-table-bg: rgba(111,66,193,.11); }
    tr.rc-6 { --bs-table-bg: rgba(253,126,20,.13); }
    tr.rc-7 { --bs-table-bg: rgba(32,201,151,.13); }
    [data-bs-theme="dark"] tr.rc-0 { --bs-table-bg: rgba(13,110,253,.28); }
    [data-bs-theme="dark"] tr.rc-1 { --bs-table-bg: rgba(25,135,84,.28); }
    [data-bs-theme="dark"] tr.rc-2 { --bs-table-bg: rgba(220,53,69,.25); }
    [data-bs-theme="dark"] tr.rc-3 { --bs-table-bg: rgba(255,193,7,.25); }
    [data-bs-theme="dark"] tr.rc-4 { --bs-table-bg: rgba(13,202,240,.25); }
    [data-bs-theme="dark"] tr.rc-5 { --bs-table-bg: rgba(111,66,193,.25); }
    [data-bs-theme="dark"] tr.rc-6 { --bs-table-bg: rgba(253,126,20,.25); }
    [data-bs-theme="dark"] tr.rc-7 { --bs-table-bg: rgba(32,201,151,.25); }
  </style>
</head>
<body class="d-flex">

  <!-- Sidebar -->
  <nav class="sidebar bg-dark d-flex flex-column p-3">
    <a class="text-white text-decoration-none mb-4 d-block" href="/dashboard">
      <div class="fw-bold fs-6">HASH PBX</div>
      <div style="font-size:.7rem;color:rgba(255,255,255,.4)">Dashboard</div>
    </a>

    <ul class="nav nav-pills flex-column gap-1 mb-auto">
      <li>
        <a href="/dashboard" class="nav-link py-2 {% if active == 'overview' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i>Overview
        </a>
      </li>
      <li>
        <a href="/dashboard/calls" class="nav-link py-2 {% if active == 'calls' %}active{% endif %}">
          <i class="bi bi-telephone-inbound me-2"></i>Calls
        </a>
      </li>
      <li>
        <a href="/dashboard/logs" class="nav-link py-2 {% if active == 'logs' %}active{% endif %}">
          <i class="bi bi-journal-text me-2"></i>System Logs
        </a>
      </li>
      <li>
        <a href="/dashboard/metrics" class="nav-link py-2 {% if active == 'metrics' %}active{% endif %}">
          <i class="bi bi-bar-chart-line me-2"></i>Call Metrics
        </a>
      </li>

      <li class="mt-2"><div class="section-label">Developer</div></li>
      <li>
        <a href="/docs" class="nav-link py-2" target="_blank" rel="noopener">
          <i class="bi bi-file-earmark-code me-2"></i>API Docs
        </a>
      </li>

      <li class="mt-2"><div class="section-label">Exports</div></li>
      <li>
        <a href="/export/calls.csv" class="nav-link py-2">
          <i class="bi bi-filetype-csv me-2"></i>Calls CSV
        </a>
      </li>
      <li>
        <a href="/export/cdr.csv" class="nav-link py-2">
          <i class="bi bi-filetype-csv me-2"></i>CDR CSV
        </a>
      </li>
      <li>
        <a href="/export/metrics.csv" class="nav-link py-2">
          <i class="bi bi-filetype-csv me-2"></i>Metrics CSV
        </a>
      </li>
    </ul>

    <div class="mt-4 border-top border-secondary pt-3 d-flex flex-column gap-1">
      <button id="theme-btn" onclick="toggleTheme()"
              class="nav-link py-2 bg-transparent border-0 text-start w-100" style="color:rgba(255,255,255,.6)">
        <i class="bi bi-sun-fill me-2"></i>Light mode
      </button>
      <a href="/logout" class="nav-link py-2" style="color:rgba(255,255,255,.6)">
        <i class="bi bi-box-arrow-right me-2"></i>Sign out
      </a>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-content p-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function _applyTheme(t) {
      document.documentElement.setAttribute('data-bs-theme', t);
      localStorage.setItem('theme', t);
      const btn = document.getElementById('theme-btn');
      if (!btn) return;
      btn.innerHTML = t === 'dark'
        ? '<i class="bi bi-sun-fill me-2"></i>Light mode'
        : '<i class="bi bi-moon-fill me-2"></i>Dark mode';
    }
    function toggleTheme() {
      _applyTheme(
        document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'
      );
    }
    // Sync button label to whatever theme was applied before paint
    document.addEventListener('DOMContentLoaded', () =>
      _applyTheme(document.documentElement.getAttribute('data-bs-theme'))
    );
  </script>
</body>
</html>
