services:
  audio-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-generator

    env_file:
      - .env

    volumes:
      # Bind-mount so generated .wav files land on the host in ./media/
      - ./media:/app/media

    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
