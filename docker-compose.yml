services:
  asterisk-audio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asterisk-audio

    env_file:
      - .env

    volumes:
      # Bind-mount so generated .mp3 files land on the host in ./media/
      - ./media:/app/media
      # Persist Kokoro TTS models and the faster-whisper STT model cache
      - ./models:/app/models
      - whisper-cache:/root/.cache/huggingface

    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  whisper-cache:
